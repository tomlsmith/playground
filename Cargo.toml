[package]
name = "tomlsmith-playground"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Browser playground adapter for the TomlSmith language core"
license = "MIT"
authors = ["Nirvana-Jie <1357711537@qq.com>"]
repository = "https://github.com/tomlsmith/playground"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
tomlsmith = "=0.3.0"
wasm-bindgen = "=0.2.101"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "=0.1.7"

[dev-dependencies]
serde_json = "=1.0.145"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
